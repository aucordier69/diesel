<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10262b">
  <title>Gazole Rhône</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="entete">
    <div class="titre">
      <h1>Gazole <span>Rhône</span></h1>
      <p id="resume" aria-live="polite">Chargement des prix…</p>
    </div>
    <label class="champ">
      <span>Commune</span>
      <select id="commune"><option value="">Toutes les communes</option></select>
    </label>
  </header>

  <div class="vues" role="group" aria-label="Affichage">
    <button type="button" data-vue="liste" aria-pressed="true">Liste</button>
    <button type="button" data-vue="carte" aria-pressed="false">Carte</button>
  </div>

  <main data-vue="liste">
    <ol id="liste" aria-busy="true">
      <li class="squelette" aria-hidden="true"></li>
      <li class="squelette" aria-hidden="true"></li>
      <li class="squelette" aria-hidden="true"></li>
      <li class="squelette" aria-hidden="true"></li>
      <li class="squelette" aria-hidden="true"></li>
      <li class="squelette" aria-hidden="true"></li>
    </ol>
    <div id="carte" role="region" aria-label="Carte des stations"></div>
  </main>

  <footer>Données : prix-carburants.gouv.fr (Licence Ouverte 2.0), actualisées toutes les 10 min environ.</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
